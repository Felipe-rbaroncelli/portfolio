<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cruzadas — O Preço da Fé</title><style>:root{--gold:#c6a66a;--cream:#eee3cb;--black:#141b19;--line:#a88a554f}*{box-sizing:border-box}body{margin:0;background:#222b27;color:var(--cream);font-family:Georgia,'Times New Roman',serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#202621dc;padding:10px 14px;transition:background .18s,border .18s}button:hover,button:focus-visible{border-color:var(--gold);background:#514732;outline:none}button:disabled{opacity:.38;cursor:not-allowed}[hidden]{display:none!important}#world{width:100vw;height:100dvh;display:block;touch-action:none}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,#11181370 100%)}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10161285;overflow:auto;z-index:10}.menuinner{width:min(510px,100%);padding:30px 40px 26px;margin-right:auto;margin-left:6vw;background:linear-gradient(90deg,#101612f5,#101612c9 75%,transparent);min-height:100%;display:flex;flex-direction:column;justify-content:center}.eyebrow,small,footer{font:10px/1.5 system-ui,sans-serif;letter-spacing:2px;color:var(--gold)}.crest{font-size:36px;color:var(--gold);margin-top:9px}h1,h2,h3,p{margin:0}h1{font-size:clamp(40px,6vw,85px);font-weight:400;letter-spacing:4px;line-height:.95;text-shadow:0 3px 18px #000}h1 span{display:block;font-size:clamp(15px,2.1vw,30px);letter-spacing:7px;color:var(--gold);margin:14px 0 20px}.tagline{font-style:italic;color:#d6c6a5;font-size:17px;margin:4px 0 26px}nav{display:grid;gap:5px;max-width:340px}nav button{text-align:left;background:linear-gradient(90deg,#3c3526b0,transparent);border:0;border-bottom:1px solid var(--line);font-size:17px;padding:10px 11px}nav button:first-child{border-left:2px solid :root{--gold:#bba16d;--cream:#e6ddc9;--line:#8b795244}body{background:#22261e}#vignette{background:radial-gradient(ellipse at 53% 48%,transparent 43%,#181b1768 100%)}.menuinner{background:linear-gradient(90deg,#141812f5 0%,#141812e6 52%,#14181298 82%,transparent);width:min(610px,100%);padding-right:65px}.crest{width:35px;height:44px;font-size:0;border:1px solid #bba16d;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);position:relative;margin:15px 0}.crest:after{content:"";position:absolute;left:15px;top:5px;width:3px;height:26px;background:#bba16d}.crest:before{content:"";position:absolute;left:7px;top:13px;width:19px;height:3px;background:#bba16d}nav button{background:transparent;padding:11px 10px;letter-spacing:.25px}nav button:first-child{background:#5d4b2d55}.location{border-left:1px solid #bba16d88;background:#171c1699}.objective{background:linear-gradient(90deg,#171b16cc,transparent);border-left:1px solid #bba16d}.compass{font:12px Georgia,serif;letter-spacing:5px;background:#15191270;border:0;border-bottom:1px solid #bba16d88}.meters{background:#171b1699;border-left:1px solid #bba16d77}.meters i,.meters b{height:3px}.quick button{background:#171b16a3;border:1px solid #9a85564d}#minimap{box-shadow:0 0 0 3px #22251b,0 0 0 4px #bba16d7a}.paper{background:#24271e;border:1px solid #8e7954;box-shadow:0 0 0 4px #141812,0 16px 70px #0009}.paper .choice{background:#33352a;border-left:1px solid #bba16d}.paper h2{letter-spacing:.3px}.paper input[type=range]{accent-color:#bba16d;width:min(180px,40%)}.screen#modal{background:#15191274}.screen#modal:has(.paper) .paper{animation:openPaper .16s ease-out}@keyframes openPaper{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){.menuinner{padding-right:25px}.crest{margin:5px 0}.objective{max-width:65%}}@media(prefers-reduced-motion:reduce){.paper{animation:none!important}}

</style></head><body><canvas id="world" aria-label="Mundo tridimensional"></canvas><div id="vignette"></div><div id="hud" hidden><div class="top"><div class="location"><small id="chapterNo"></small><h2 id="place"></h2><span id="date"></span></div><div class="compass" id="compass">N</div><button id="pause" aria-label="Pausar">☰</button></div><div class="objective"><small>JORNADA PRINCIPAL</small><div id="objective"></div><span id="hint"></span></div><div id="mini"><canvas id="minimap" width="150" height="150"></canvas><span>MAPA LOCAL</span></div><div class="bottom"><div class="meters"><div><label>VIDA</label><i><b id="hp"></b></i></div><div><label>ENERGIA</label><i><b id="energy"></b></i></div><div><label>FOME</label><i><b id="food"></b></i></div><small id="stats"></small></div><div id="prompt"></div><div class="quick"><button data-panel="inventory">I · Bolsa</button><button data-panel="map">M · Mapa</button><button data-panel="journal">J · Diário</button></div></div><div id="touch"><div id="joy"><i></i></div><div class="touchbuttons"><button id="touchAttack">⚔</button><button id="touchJump">↑</button><button id="touchInteract">E</button><button id="touchBlock">Def.</button></div></div></div><div id="toast" role="status"></div><div id="intro" class="screen" hidden><div class="cinema"><small>EUROPA · 1095</small><h1>O chamado</h1><p id="introText"></p><button id="skip">Pular introdução →</button></div></div><main id="menu" class="screen"><div class="menuinner"><div class="eyebrow">UMA CRÔNICA DA PRIMEIRA CRUZADA · 1095–1099</div><div class="crest">✦</div><h1>CRUZADAS<span>O PREÇO DA FÉ</span></h1><p class="tagline">Toda promessa carrega um preço.</p><nav><button id="new">Iniciar jornada <span>→</span></button><button id="continue">Continuar jornada <span>↗</span></button><button id="school">Modo apresentação <span>10–15 min</span></button><button data-panel="chapters">Selecionar capítulo</button><button data-panel="journal">Diário histórico</button><button data-panel="settings">Configurações</button><button data-panel="credits">Créditos</button></nav><footer>RPG HISTÓRICO INDEPENDENTE · PROJETO EDUCACIONAL<br>WASD / mouse / E · também compatível com toque</footer></div></main><div id="modal" class="screen" hidden><section class="paper"><button id="close" class="close" aria-label="Fechar">×</button><div id="content"></div></section></div><div id="ending" class="screen" hidden><div class="cinema"><small>EPÍLOGO · O PREÇO DA FÉ</small><h1 id="endTitle"></h1><div id="endBody"></div><button id="endMenu">Voltar ao menu</button></div></div><script>const STORY=[
{title:'Os esquecidos da Europa',place:'Vila francesa',date:'Outono de 1095',theme:'france',intro:'A colheita falhou. O senhor exige sua parte, e seu pai mal consegue se levantar. Antes de pensar em Jerusalém, há uma família para alimentar.',npc:'Isabelle',line:'Gabriel, sobraram seis sacos de trigo. O senhor exige dois, e precisamos de três para o inverno. Só um pode ser vendido. O que faremos?',task:'Recolher o último saco de trigo no celeiro',object:'Saco de trigo',choices:[['Entregar os tributos e guardar o necessário.','O inverno será difícil, mas não perderemos a terra.','camponeses','peregrino',2],['Vender o excedente e comprar mantimentos.','Isabelle anota a venda e reserva o alimento.','comerciantes','mercador',4],['Dividir parte da reserva com a viúva.','A aldeia retribui sua solidariedade.','camponeses','diplomata',0]],after:'Meu filho, muitos homens partem acreditando conhecer a verdade. Poucos retornam sabendo o preço que ela custou. — Pai de Gabriel',fact:'A sociedade medieval era hierarquizada. Obrigações camponesas variavam conforme região e condição; nem todos eram servos. A Igreja exercia influência social e política.',side:[['A última colheita','Camponês Martin','Minha enxada quebrou. Preciso recuperar uma ferramenta antes da chuva.','Enxada'],['Uma carta para casa','Pai de Gabriel','Leve a carta à sua irmã. Não deixe que a viagem apague a memória de casa.','Carta de família']]},
{title:'O chamado',place:'Clermont',date:'Novembro de 1095',theme:'clermont',intro:'A multidão se reúne. Notícias sobre o concílio se espalham entre nobres, religiosos e camponeses. As palavras de Urbano II não chegam a todos da mesma maneira.',npc:'Irmão Thomas',line:'O papa convocou uma expedição. Fala-se em remissão da penitência, auxílio aos cristãos do Oriente e Jerusalém. Adelard fala em terras. E você, por que partiria?',task:'Ler o relato da convocação junto ao púlpito',object:'Relato de Clermont',choices:[['Por fé e penitência.','Thomas pede que nunca confunda fé com crueldade.','expedição','peregrino',1],['Para ganhar prestígio e proteger a família.','Étienne promete ensinar disciplina; Adelard vê oportunidade.','nobres','cavaleiro',4],['Para encontrar trabalho e conhecer outras terras.','Os mercadores lhe oferecem companhia na estrada.','comerciantes','mercador',3]],after:'Gabriel prende o medalhão sob a túnica e deixa a França. Isabelle observa até que ele desapareça.',fact:'Em novembro de 1095, Urbano II fez a convocação em Clermont. As versões preservadas do discurso foram registradas por cronistas e diferem; os diálogos do jogo são dramatizações.',side:[['O pão desaparecido','Padeira Agnès','Um peregrino perdeu a provisão. Ajude a encontrar o pão sem acusar ninguém.','Cesto de pão'],['A dívida do cavaleiro','Étienne','O ferreiro aguarda meu pagamento. Recupere o recibo para resolver a cobrança.','Recibo']]},
{title:'A estrada dos peregrinos',place:'Estradas da Europa',date:'1096',theme:'road',intro:'A estrada é longa. A chuva transforma o caminho em lama e as provisões acabam. A travessia não se parece com a promessa de glória.',npc:'Étienne',line:'Somos quatro viajantes, e precisamos de comida para três dias. Doze rações. Temos oito. Um mercador oferece quatro, mas cobra caro. Há outro caminho pela mata.',task:'Examinar as provisões no posto da estrada',object:'Provisões da caravana',choices:[['Comprar as quatro rações.','A negociação evita uma jornada extra.','comerciantes','mercador',-4],['Organizar a divisão e buscar ajuda local.','A comunidade contribui; vocês perdem tempo, não vidas.','camponeses','diplomata',0],['Escoltar a caravana por um trecho perigoso.','Étienne reconhece sua coragem e cautela.','expedição','cavaleiro',2]],after:'Ao anoitecer, Thomas escreve: a estrada separa promessas de possibilidades.',fact:'As expedições partiram por rotas diversas em 1096. Abastecimento, doenças e transporte eram obstáculos centrais. Houve também violência contra comunidades judaicas na Europa.',side:[['O viajante perdido','Peregrina Marta','Encontre o marco de pedra para indicar o caminho seguro.','Marco de estrada'],['As crianças da estrada','Irmão Thomas','Uma família precisa de água. Traga o odre deixado perto das árvores.','Odre']]},
{title:'A cidade dourada',place:'Constantinopla',date:'1096–1097',theme:'byzantine',intro:'Muralhas imensas protegem uma cidade de mercados, igrejas e embarcações. A capital bizantina não é uma extensão da França: tem governo, interesses e tradições próprios.',npc:'Helena',line:'Aleixo I buscou auxílio contra os seljúcidas, mas agora precisa lidar com exércitos estrangeiros. Há juramentos sobre territórios recuperados. Você pode respeitar os acordos ou buscar vantagem.',task:'Examinar o documento de acordo perto do mercado',object:'Documento imperial',choices:[['Respeitar o acordo e defender a cooperação.','Helena confia em você e apresenta novos contatos.','comunidades','diplomata',2],['Negociar seda e provisões com os mercadores.','O comércio oferece uma oportunidade sem depender de saque.','comerciantes','mercador',5],['Manter lealdade aos chefes da expedição.','Adelard aprova, mas Helena alerta para a tensão.','nobres','cavaleiro',2]],after:'O Bósforo fica para trás. Gabriel compreende que cristãos também discordavam entre si.',fact:'Constantinopla era capital do Império Bizantino. Aleixo I Comneno negociou com líderes cruzados e buscou recuperar territórios; interesses bizantinos e latinos nem sempre coincidiam.',side:[['O mercador de Constantinopla','Helena, ajudante','Recupere a lista de mercadorias para liberar a encomenda.','Lista de carga'],['O preço da seda','Mercador Demétrio','Uma amostra foi esquecida perto do porto. Traga-a para avaliar a qualidade.','Amostra de seda']]},
{title:'Além das fronteiras',place:'Niceia e Anatólia',date:'1097',theme:'anatolia',intro:'Niceia passou ao controle bizantino. A caravana segue por uma paisagem seca, marcada por caminhos comerciais e comunidades diversas.',npc:'Yusuf',line:'Não sou soldado, Gabriel. Minha família depende desta rota. Há um viajante ferido adiante. Seu capitão ordenou seguir; o que vale mais neste momento?',task:'Localizar o viajante junto ao poço',object:'Viajante ferido',choices:[['Ajudar Yusuf a proteger o viajante.','Você atrasa o grupo, mas ganha a confiança de Yusuf.','comunidades','diplomata',0],['Negociar água e transporte.','Yusuf consegue reorganizar a caravana.','comerciantes','mercador',3],['Voltar rapidamente ao contingente.','Étienne aprova a disciplina, embora lamente o abandono.','expedição','cavaleiro',2]],after:'Yusuf diz: “As estradas já existiam antes de vocês. Espero que continuem existindo depois.”',fact:'Niceia capitulou em 1097 e foi entregue aos bizantinos. A travessia da Anatólia expôs a expedição a problemas militares e logísticos. O comércio e as populações locais não se reduziam ao conflito religioso.',side:[['O mapa incompleto','Cartógrafo','Falta identificar o poço na rota. Procure o fragmento do mapa.','Fragmento de mapa'],['Uma amizade improvável','Aprendiz de Yusuf','Encontre o pequeno pacote destinado a uma família local.','Pacote de tecidos']]},
{title:'A cidade sitiada',place:'Antioquia',date:'1097–1098',theme:'antioch',intro:'Meses diante das muralhas. A fome e as deserções ameaçam o acampamento. Até os líderes discordam sobre o futuro da cidade.',npc:'Adelard',line:'Restam poucas provisões. Os homens exigem alimento. Há famílias perto do acampamento que também precisam comer. Dividir pode enfraquecer nossas reservas.',task:'Inspecionar os sacos no depósito do acampamento',object:'Reserva de cevada',choices:[['Dividir as provisões com civis e soldados.','Thomas ajuda a organizar a entrega.','comunidades','diplomata',-2],['Reservar o alimento para a tropa.','Adelard recompensa sua lealdade, mas as famílias se afastam.','nobres','cavaleiro',5],['Negociar um novo abastecimento com a caravana.','O acordo custa moedas, mas beneficia ambos os grupos.','comerciantes','mercador',-3]],after:'Antioquia é tomada em 1098. As rivalidades pelo controle da cidade continuam. A guerra não termina com a vitória.',fact:'O cerco de Antioquia começou em 1097 e terminou com a conquista cruzada em 1098. A escassez foi grave; as disputas pelo domínio da cidade acentuaram tensões com Bizâncio.',side:[['O diário do monge','Irmão Thomas','Minhas anotações caíram durante a mudança do acampamento.','Caderno de Thomas'],['O remédio perdido','Curandeira Beatriz','Recupere o pano limpo para cuidar de uma pessoa ferida.','Pano limpo']]},
{title:'As muralhas de Jerusalém',place:'Jerusalém',date:'Julho de 1099',theme:'jerusalem',intro:'A cidade sagrada aparece no horizonte. Depois do cerco, a conquista é marcada pela morte de habitantes muçulmanos e judeus. A câmera se afasta das ruas; o silêncio pesa.',npc:'Étienne',line:'Eu sonhei com a glória por anos. Agora há uma família escondida junto ao portão e nosso grupo está se dispersando. Gabriel, o que faremos?',task:'Encontrar o abrigo sinalizado junto à muralha',object:'Abrigo de civis',choices:[['Acompanhar os civis até um abrigo.','Yusuf não esquece sua decisão. Étienne o acompanha.','comunidades','diplomata',0],['Proteger os companheiros e recusar saques.','Étienne respeita sua disciplina e sua recusa à violência contra civis.','expedição','cavaleiro',3],['Deixar as armas e buscar Thomas.','O monge acolhe sua dúvida: a fé não exige celebrar sofrimento.','camponeses','peregrino',0]],after:'15 de julho de 1099. Jerusalém foi conquistada. Nenhuma escolha de Gabriel muda esse fato ou apaga a violência.',fact:'Jerusalém foi conquistada em 15 de julho de 1099. Fontes relatam violência massiva contra habitantes, sobretudo muçulmanos e judeus. Os relatos divergem em detalhes e devem ser lidos criticamente.',side:[['O refugiado','Yusuf','Há uma manta perto do abrigo. Uma família precisa dela.','Manta'],['A promessa quebrada','Étienne, escudeiro','Encontre o medalhão de um companheiro para devolvê-lo à família.','Medalhão perdido']]},
{title:'O preço da fé',place:'Acampamento do retorno',date:'Fim de 1099',theme:'return',intro:'O ruído da guerra diminui. Thomas fecha o diário. Há novas fronteiras e poderes no Oriente, mas Gabriel ainda precisa decidir onde é seu lugar.',npc:'Irmão Thomas',line:'O que levaremos para casa? Honras, mercadorias, lembranças? Nenhum de nós voltou a ser a mesma pessoa. Isabelle escreveu pela última vez; leia sua carta.',task:'Buscar a carta de Isabelle perto da fogueira',object:'Carta de Isabelle',choices:[['Voltar para minha família.','A estrada de volta começa.','camponeses','retorno',0],['Seguir negociando e protegendo viajantes.','A experiência de Gabriel definirá seu caminho.','comerciantes','mercador',3],['Permanecer ao lado de Thomas e dos companheiros.','O peso das escolhas definirá seu legado.','expedição','peregrino',0]],after:'O medalhão do pai permanece junto ao coração. A jornada termina; a história continua.',fact:'Os Estados cruzados incluíram Edessa, Antioquia, Jerusalém e depois Trípoli. Outras cruzadas ocorreram nos séculos seguintes. Comércio e intercâmbios se transformaram ao longo do tempo, sem terem começado com as Cruzadas.',side:[['O retorno para casa','Mensageira','Recupere o mapa do caminho de volta.','Mapa do retorno'],['A última testemunha','Escriba','Traga o registro das provisões para conservar a memória da viagem.','Registro de viagem']]}

interact=function(){if(!playing||modal||!$('intro').hidden)return;if(near?.id?.startsWith('v3:')){action(near.id.slice(3),near);return}if(near?.id==='rest'){state.thirst=100;state.fatigue=0;state.temperature=36.7;state.wounds=Math.max(0,state.wounds-1);if(state.items['Carne crua']&&state.items.Lenha){use('Carne crua');use('Lenha');addItem('Carne assada',1)}}if(near?.id==='obj')return;base.interact()};

function damage(e,n){if(e.hp<=0)return;if(e.kind==='armored'&&e.mode==='guard')n*=.2;if(e.kind==='boss'&&e.mode==='guard')n*=.35;e.hp=Math.max(0,e.hp-n);e.hit=.23;if(e.hp<=0){worldNPC=worldNPC.filter(x=>x!==e);gain(e.kind==='deer'?14:25,e.kind==='deer'?'Sobrevivência':'Força');if(e.kind==='deer'){addItem('Carne crua',2);addItem('Lenha',1);mark('hunt')}if(e.id==='v3:raoul'){mark('tax');state.rep.camponeses++}sound(160,.17);save()}}

function shoot(from,angle,vertical,enemy=false){let speed=enemy?13:22+state.talents.Arqueiro*2;bolts.push({x:from.x,y:enemy?1.2:player.y+1.25,z:from.z,vx:-Math.sin(angle)*speed,vz:-Math.cos(angle)*speed,vy:vertical,enemy,life:3})}
attack=function(heavy=false){if(!playing||modal||!$('intro').hidden||elapsed-attackAt<.38)return;let w=state.weapon||'Espada simples',s=weaponStats[w]||weaponStats['Espada simples'];if(state.energy<s[2]*(heavy===true?1.5:1))return;if(w==='Arco'&&!use('Flecha'))return;let foes=A()?.enemies.filter(e=>e.hp>0)||[];if(!foes.length&&state.training&&w!=='Arco'){base.attack();return}attackAt=elapsed;state.energy-=s[2]*(heavy===true?1.5:1);player.attack=.3;player.rot=Math.atan2(-Math.sin(yaw),Math.cos(yaw));if(w==='Arco'){shoot(player,yaw,-pitch*6+1.6);sound(310,.06);return}let hit=foes.filter(e=>dist(player,e)<s[1]&&Math.cos(Math.atan2(-(e.x-player.x),-(e.z-player.z))-yaw)>-.25).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(hit)damage(hit,s[0]*(heavy===true?1.65:1)*(1+state.talents.Guerreiro*.16));sound(hit?125:200,.11)};
const paths=new WeakMap();function clearLine(x,z,xx,zz){let l=Math.hypot(xx-x,zz-z);for(let i=.4;i<l;i+=.5)if(blocked(x+(xx-x)*i/l,z+(zz-z)*i/l))return false;return true}

function showTravel(from,to){if(settings.reduced)return;let old=$('travel');if(old)old.remove();let e=document.createElement('div');e.id='travel';e.className='screen';let pts=[[45,52],[83,69],[137,94],[264,150],[286,174],[320,235],[337,285],[366,315]];let a=pts.slice(0,to+1),p=pts[to];e.innerHTML=`<section class="travelpaper"><small>CRÔNICA DA JORNADA · ROTA ESQUEMÁTICA</small><h2>${STORY[to].place}</h2><p>${STORY[to].date} · ${region.name}</p><svg viewBox="0 0 400 330" role="img" aria-label="Trajeto esquemático da viagem"><path d="M0 0H400V125L344 112 290 145 251 120 172 98 110 40 0 36Z" fill="#a7a77c"/><path d="M0 125L95 124 146 169 177 200 210 182 250 201 256 246 310 264 319 330H0Z" fill="#9daaa0"/><path d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" stroke="#a58a68" stroke-dasharray="3 5" stroke-width="2"/><path class="travel-line" pathLength="100" d="M${a.map(p=>p.join(' ')).join('L')}" fill="none" stroke="#8a5139" stroke-width="3"/>${pts.map((v,i)=>`<circle cx="${v[0]}" cy="${v[1]}" r="${i===to?6:3}" fill="${i<=to?'#79523b':'#a79b7f'}"/>`).join('')}<text x="${Math.min(p[0]+9,295)}" y="${p[1]-10}" font-size="10" fill="#493524">${STORY[to].place.split(' e ')[0]}</text></svg><p>${STORY[to].intro}</p><button id="travelSkip">Continuar viagem →</button></section>`;document.body.append(e);modal='travel';const closeTravel=()=>{clearTimeout(travelTimer);e.remove();if(modal==='travel')modal='';keys={}};$('travelSkip').onclick=closeTravel;travelTimer=setTimeout(closeTravel,4500)}
interact=function(){if(!playing||modal||!$('intro').hidden)return;let o=near;if(o?.id?.startsWith('map:')){let id=o.id.slice(4),f=flags();switch(o.kind){case 'door':{let d=regionDoors.find(d=>d.id===id);if(!d)return;if(d.opened&&dist(player,d)<1.2){toast('Afaste-se da porta para fechá-la.');return}d.opened=!d.opened;f[id]=d.opened;obstacles=obstacles.filter(a=>a.id!==id);if(!d.opened)obstacle(d.x,d.z,.825,.13,id);toast(d.opened?'Porta aberta.':'Porta fechada.');break}case 'secret':if(!f[id]){addItem('Pano limpo',1);addItem('Fruta',2);state.coins+=3;gain(25,'Conhecimento');f[id]=true;toast('Segredo descoberto · 3 moedas, fruta e pano.')}break;case 'fish':if((f.fishAt||0)>Date.now()){toast('Espere os peixes voltarem.');return}f.fishAt=Date.now()+35000;addItem('Carne assada',1);gain(5,'Sobrevivência');player.attack=.3;toast('Peixe preparado · uma porção de alimento.');break;case 'animals':if(!f[id]){addItem('Pão',1);gain(10,'Sobrevivência');f[id]=true;toast('Animais cuidados · provisão recebida.')}break;case 'speech':if(!f[id]){f[id]=true;gain(15,'Conhecimento');talk('Relato dramatizado de Clermont','A convocação de Urbano II, em novembro de 1095, mobilizou grupos por diferentes motivos. Os relatos sobreviventes do discurso não são idênticos.',['Ouvir e guardar o relato'],()=>{close();save()});}break;}save();updateHud();return}let old=state.ch;if(o?.id==='exit'&&state.ch===7&&state.stage>=3){let k=Object.keys(state.path).sort((a,b)=>state.path[b]-state.path[a])[0];if(state.path.retorno>=6)k='retorno';if(k!==regionVariant){state.pos={x:0,z:13};start(state);toast('Seu destino mudou. Explore o novo cenário e retorne à saída.');return}}mapInteract();if(state.ch!==old)showTravel(old,state.ch)};

const mapCamera=camera;camera=function(t,p,yaw,pitch,playing,s){let q=mapCamera(t,{...p,y:p.y+walkH(p.x,p.z)},yaw,pitch,playing,s);if(playing&&regionDoors.some(d=>Math.abs(p.x-d.x)<1.65&&p.z>d.z&&p.z<d.z+3.3)){let yy=mapH(p.x,p.z);q={eye:[q.eye[0],Math.min(q.eye[1],yy+2.1),q.eye[2]],target:q.target}}return q};

const mapArt=artDynamics;artDynamics=function(t,s,eye){mapArt(t,s,eye);for(let o of regionActions){if(o.kind==='secret'&&!state.mapFlags?.[regionIndex]?.secret){crate(o.x,o.z,.65);box(o.x,.55,o.z,.67,.13,.62,'806849',0,2)}if(o.kind==='fish'){tube([o.x,.03,o.z],[o.x+.65,.23,o.z+.25],.025,.012,'735e42',5,2)}}for(let d of regionDoors){let angle=d.opened?Math.PI/2:0;box(d.x+(d.opened?-.78:0),0,d.z+(d.opened?.78:0),1.55,1.9,.10,'71563b',angle,2);if(!d.opened)ell(d.x+.52,1,d.z-.065,.045,.045,.03,'a68e5c',6,3)}for(let d of decor){if(Math.hypot(d.x-eye[0],d.z-eye[2])>40)continue;if(d.kind==='mill'){for(let i=0;i<4;i++){let a=t*.4+i*TAU/4,xx=Math.sin(a),yy=Math.cos(a);tube([d.x,d.y,d.z],[d.x+xx*2.5,d.y+yy*2.5,d.z],.07,.055,'6a503a',6,2);let u=[-yy*.32,xx*.32];quad([d.x+xx*.6,d.y+yy*.6,d.z],[d.x+xx*2.35,d.y+yy*2.35,d.z],[d.x+xx*2.35+u[0],d.y+yy*2.35+u[1],d.z],[d.x+xx*.6+u[0],d.y+yy*.6+u[1],d.z],C('bcae90'),4)}}else if(d.kind==='riverRipple'&&s.effects!==false){let x=d.x+Math.sin(t*.6+d.phase)*.4;box(x,d.y,d.z,1.4,.008,.045,'9cbbb9',-d.angle,7)}else if(d.kind==='falls'&&s.effects!==false){for(let i=0;i<5;i++)box(d.x+(i-2)*.4,((i*.47-t*1.8)%2.3+2.3)%2.3,d.z+.09,.045,.38,.03,'b8d0cd',0,7)}}};
// Draw contextual map from the same geometry, not from a generic crossroads.
function localDraw(ctx,w,h,center,scale,clip=false){let point=(x,z)=>[w/2+(x-center.x)*scale,h/2+(z-center.z)*scale];ctx.save();if(clip){ctx.beginPath();ctx.arc(w/2,h/2,w/2-1,0,TAU);ctx.clip()}ctx.fillStyle='#'+region.ground;ctx.fillRect(0,0,w,h);const poly=(p,col,width)=>{ctx.beginPath();for(let i=0;i<p.length;i++){let [x,z]=point(...p[i]);i?ctx.lineTo(x,z):ctx.moveTo(x,z)}ctx.strokeStyle=col;ctx.lineWidth=width*scale;ctx.lineCap='round';ctx.stroke()};for(let p of region.paths)poly(p,'#'+region.road,3.5);for(let r of region.waterways||[])poly(r.points,'#'+region.water,r.width);if(regionIndex===3){let [x,z]=point(29,-44);ctx.fillStyle='#'+region.water;ctx.fillRect(x,z,15*scale,68*scale)}ctx.fillStyle='#655b4e';for(let o of obstacles){let [x,z]=point(o.x-o.w,o.z-o.d);ctx.fillRect(x,z,o.w*2*scale,o.d*2*scale)}for(let p of regionPOI){let [x,z]=point(p.x,p.z);ctx.fillStyle='#e5c68b';ctx.fillRect(x-2,z-2,4,4);if(!clip){ctx.font='11px Georgia';ctx.fillStyle='#302a21';ctx.fillText(p.name,x+4,z-5)}}for(let o of [...worldNPC,...worldObjects])if(!o.ambient&&active(o)&&o.kind!=='secret'){let [x,z]=point(o.x,o.z);ctx.fillStyle=o.id==='merchant'?'#496c64':o.ai&&!o.friendly?'#a34c3d':'#e0d7b7';ctx.beginPath();ctx.arc(x,z,2,0,TAU);ctx.fill()}let q=target();if(q){let [x,z]=point(q.x,q.z);if(clip){let dx=x-w/2,dz=z-h/2,l=Math.hypot(dx,dz);if(l>w/2-7){x=w/2+dx/l*(w/2-7);z=h/2+dz/l*(w/2-7)}}ctx.fillStyle='#f4d080';ctx.beginPath();ctx.arc(x,z,4,0,TAU);ctx.fill()}let [x,z]=point(player.x,player.z);ctx.translate(x,z);ctx.rotate(player.rot);ctx.fillStyle='#fff7da';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();ctx.restore()}
